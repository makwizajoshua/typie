[project]
name = "typie-backend"
version = "0.1.0"
description = "Typie backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "bcrypt",
    "pydantic[email]",
    "python-dotenv",
    "python-multipart",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "Depends",
    "fastapi.Depends",
    "Query",
    "Path",
    "Header"
]
